// gradle/project-config.gradle
// Centralized configuration for the projectx hub project

// JDK version configuration
project.ext.TARGET_JDK_VERSION = 11
project.ext.JDK_VENDOR = 'ADOPTIUM'

// Common project paths
project.ext.PLUGINS_SOURCE_PATH = 'src/main/java/net/runelite/client/plugins/projectx'
project.ext.PLUGINS_RESOURCE_PATH = 'src/main/resources/net/runelite/client/plugins/projectx'
project.ext.DOCS_OUTPUT_PATH = 'public/docs'

// Relative path for source set
project.ext.PLUGINS_INCLUDE_PATH = 'net/runelite/client/plugins/projectx'

// GitHub release configuration
project.ext.GITHUB_CLIENT_RELEASE_BASE_URL = 'https://github.com/iEasyScript/xclient/releases/download'
project.ext.GITHUB_PLUGINS_RELEASE_BASE_URL = 'https://github.com/iEasyScript/xclient-hub/releases/download'
// Blank: upstream's version feed reports Project X's versions, which are not ours.
// The client version is pinned below and overridden with -PprojectxClientVersion.
project.ext.PROJECTX_CLIENT_VERSION_ENDPOINT = ''
project.ext.GITHUB_PLUGINS_RELEASE_TAG = 'latest-release'

// Plugin defaults
project.ext.DEFAULT_VERSION = '1.0.0'
project.ext.DEFAULT_AUTHORS = ['Unknown Author']
project.ext.DEFAULT_SUPPORT_URL = 'https://xclient.dev'

// Maven publication
project.ext.MAVEN_GROUP_ID = 'net.runelite.client.plugins.projectx'
project.ext.PROJECTX_CLIENT_VERSION = '2.6.22'

// Helper functions for accessing config
project.ext.getPluginsSourcePath = { -> project.ext.PLUGINS_SOURCE_PATH }
project.ext.getPluginsResourcePath = { -> project.ext.PLUGINS_RESOURCE_PATH }
project.ext.getPluginsIncludePath = { -> project.ext.PLUGINS_INCLUDE_PATH }
project.ext.getDocsOutputPath = { -> project.ext.DOCS_OUTPUT_PATH }
project.ext.getGithubClientBaseUrl = { -> project.ext.GITHUB_CLIENT_RELEASE_BASE_URL }
project.ext.getGithubPluginsBaseUrl = { -> project.ext.GITHUB_PLUGINS_RELEASE_BASE_URL }
project.ext.getGithubPluginsReleaseTag = { -> project.findProperty("pluginsReleaseTag") ?: project.ext.GITHUB_PLUGINS_RELEASE_TAG }
project.ext.fetchLatestProjectXClientVersion = {
    if (!project.ext.PROJECTX_CLIENT_VERSION_ENDPOINT) {
        return null
    }
    if (project.gradle.startParameter.offline) {
        project.logger.warn("⚠️ Offline mode: cannot fetch latest projectx client version; falling back to default ${project.ext.PROJECTX_CLIENT_VERSION}")
        return null
    }
    try {
        def url = new URL(project.ext.PROJECTX_CLIENT_VERSION_ENDPOINT)
        def connection = url.openConnection()
        connection.setRequestProperty('Accept', 'text/plain')
        connection.connectTimeout = 3000
        connection.readTimeout = 3000
        def latestVersion = connection.inputStream.getText('UTF-8')?.trim()
        if (latestVersion) {
            project.logger.lifecycle("🤖 Fetched latest projectx client version: ${latestVersion}")
            return latestVersion
        }
    } catch (Exception e) {
        project.logger.warn("⚠️ Unable to fetch latest projectx client version from ${project.ext.PROJECTX_CLIENT_VERSION_ENDPOINT}: ${e.message}")
    }
    return null
}

project.ext.getProjectXClientVersion = {
    def overrideVersion = project.findProperty("projectxClientVersion")
    if (overrideVersion) {
        if (overrideVersion.toString().equalsIgnoreCase("latest")) {
            def resolved = project.ext.fetchLatestProjectXClientVersion()
            if (resolved) {
                return resolved
            }
            project.logger.warn("⚠️ Falling back to default projectx client version ${project.ext.PROJECTX_CLIENT_VERSION}")
        } else {
            return overrideVersion
        }
    }
    def latest = project.ext.fetchLatestProjectXClientVersion()
    if (latest) {
        return latest
    }
    project.logger.warn("⚠️ Falling back to default projectx client version ${project.ext.PROJECTX_CLIENT_VERSION}")
    return project.ext.PROJECTX_CLIENT_VERSION
}
